version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hinglish_stt_platform
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=sqlite:///./transcriptions.db
      - CORS_ORIGINS=*
    volumes:
      - db_data:/app

volumes:
  db_data:
